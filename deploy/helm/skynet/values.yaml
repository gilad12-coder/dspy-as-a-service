# Default values for skynet — production-sane defaults.
# Override with `--values values-dev.yaml` or `--set key=value` for env-specific tweaks.

# ─────────────────────────────────────────────────────────────────────────────
# Global cluster-wide settings
# ─────────────────────────────────────────────────────────────────────────────
global:
  # If set, prepended to every image (e.g. "artifactory.your-company.com/skynet").
  imageRegistry: ""
  # Pull secrets applied to every deployment (and the migration job).
  imagePullSecrets: []
  # Optional name suffix; useful when running parallel installs in the same namespace.
  nameOverride: ""
  fullnameOverride: ""

# ─────────────────────────────────────────────────────────────────────────────
# ServiceAccount — one per service, OpenShift annotations supported
# ─────────────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  # Suffix appended to the chart fullname for backend/frontend SAs.
  # Final names: <release>-skynet-backend, <release>-skynet-frontend.

# ─────────────────────────────────────────────────────────────────────────────
# Backend (FastAPI + embedded worker)
# ─────────────────────────────────────────────────────────────────────────────
backend:
  image:
    repository: skynet/backend
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  replicas: 2
  containerPort: 8000

  # Conservative requests keep idle pods efficient; limits leave headroom for
  # optimization children. Tune from measured job size before raising worker
  # concurrency.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2000m"
      memory: 4Gi

  # Optional mounts for internal CA bundles or site-specific runtime files.
  # Example:
  # extraVolumes:
  #   - name: internal-ca
  #     secret:
  #       secretName: skynet-internal-ca
  # extraVolumeMounts:
  #   - name: internal-ca
  #     mountPath: /etc/skynet/ca
  #     readOnly: true
  extraVolumes: []
  extraVolumeMounts: []

  # Non-secret env (rendered into ConfigMap). Secrets go in `secrets` below.
  env:
    LOG_LEVEL: INFO
    # `json` ships structured logs that Loki / Splunk / Elastic ingest
    # without a parser. Set to `text` for human-readable local debugging.
    LOG_FORMAT: json
    API_HOST: 0.0.0.0
    API_PORT: "8000"
    WORKER_CONCURRENCY: "2"
    WORKER_POLL_INTERVAL: "2.0"
    WORKER_STALE_THRESHOLD: "600"
    JOB_ADMISSION_MAX_MEMORY_FRACTION: "0.85"
    # SQLAlchemy pool budget per pod. Total connections = replicas ×
    # (DB_POOL_SIZE + DB_POOL_MAX_OVERFLOW). Keep total well below
    # postgres.maxConnections (default 200) to leave room for migrations
    # and admin sessions.
    DB_POOL_SIZE: "10"
    DB_POOL_MAX_OVERFLOW: "10"
    DB_POOL_TIMEOUT: "30"
    DB_POOL_RECYCLE: "3600"
    # Set true when backend pods connect through PgBouncer in transaction mode.
    # The chart forces this to true when pgbouncer.enabled=true.
    DB_PGBOUNCER_TRANSACTION_MODE: "false"
    # Refuse to start if SKYNET_CODE_VERSION isn't baked into the image.
    # Prevents multiple pods from claiming each other's "unknown"-tagged jobs
    # during staged rollouts.
    REQUIRE_CODE_VERSION: "true"
    ALLOWED_ORIGINS: ""
    USER_STORAGE_QUOTA_BYTES: "262144000"
    DATASET_MAX_FILE_BYTES: "52428800"
    TELEMETRY_ENABLED: "true"
    LOG_SHIP_URL: ""
    ALERT_WEBHOOK_URL: ""
    ALERT_MIN_LEVEL: "ERROR"
    ALERT_ENVIRONMENT: "production"
    ALERT_THROTTLE_SECONDS: "300"
    POSTHOG_HOST: ""
    TRANSCRIPTION_BASE_URL: ""
    TRANSCRIPTION_MODEL: "whisper-large-v3-turbo"
    # Explore search engine — also decides which Postgres extension the deploy
    # needs. The single knob to switch search profiles:
    #   "lexical"  (default): vanilla Postgres, no extension, ILIKE search. The
    #              migrate Job never runs CREATE EXTENSION — the safe choice for
    #              an air-gapped database you can't add extensions to.
    #   "bm25":    needs the pg_search extension (ranked lexical; degrades to
    #              ILIKE if pg_search is absent).
    #   "semantic": needs the pgvector extension + the embedding gateway below
    #              (vector search; the only profile whose migrate Job runs
    #              CREATE EXTENSION vector and writes the job_embeddings schema).
    SEARCH_BACKEND: "lexical"
    # Only used when SEARCH_BACKEND=semantic.
    EMBEDDINGS_BASE_URL: ""
    EMBEDDINGS_MODEL: "jina-embeddings-v4"
    # air-gap — use the bundled litellm cost map instead of fetching from GitHub on import.
    LITELLM_LOCAL_MODEL_COST_MAP: "True"
    # WARNING: empty CODE_AGENT_BASE_URL / GENERALIST_AGENT_BASE_URL fall back to
    # the public OpenRouter default model and are NOT air-gap-safe. Set them to
    # your internal OpenAI-compatible gateway.
    CODE_AGENT_BASE_URL: ""
    CODE_AGENT_MODEL: ""
    GENERALIST_AGENT_BASE_URL: ""
    GENERALIST_AGENT_MODEL: ""
    # Frontend address used when composing user-facing links.
    FRONTEND_URL: ""
    # Prefer IdP groups for admin authorization. ADMIN_USERNAMES is break-glass only.
    ADMIN_GROUPS: ""
    ADMIN_USERNAMES: ""

  # Extra envFrom entries (existing ConfigMaps/Secrets) — appended verbatim.
  envFrom: []

  # Prometheus scrape annotations on each backend pod. Toggle off when the
  # cluster uses ServiceMonitor / PodMonitor CRDs instead of annotation-based
  # discovery.
  metrics:
    enabled: true
    path: /metrics

  # Secrets rendered into a chart-managed Secret. Set existingSecret to reuse one.
  secrets:
    existingSecret: ""
    # Used only when existingSecret is empty.
    data:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      FIREWORKS_AI_API_KEY: ""
      # Optional. If empty, OPENAI_API_KEY is reused for the embedding API.
      EMBEDDINGS_API_KEY: ""
      # Must match frontend.secrets.data.BACKEND_AUTH_SECRET.
      BACKEND_AUTH_SECRET: ""
      # Fernet key for encrypted provider connections. Required to save BYOK.
      BYOK_VAULT_KEY: ""
      TRANSCRIPTION_API_KEY: ""
      LOG_SHIP_TOKEN: ""
      POSTHOG_PROJECT_API_KEY: ""
      # REMOTE_DB_URL is composed below — see externalDatabase / postgres stanzas.
      # Override here only if you want to bypass the composer.
      REMOTE_DB_URL: ""

  # OpenShift assigns runAsUser/fsGroup from the project UID range — do NOT pin them.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0  # 0 = disabled
    queueDepth:
      enabled: true
      # Requires Prometheus Adapter (or equivalent custom-metrics adapter) to
      # expose the scraped Prometheus series as a Kubernetes External metric.
      metricName: skynet_jobs_pending
      # When empty, the chart targets backend.extraEnv.WORKER_CONCURRENCY so
      # scale-up triggers once each pod's queue tops what it can process in
      # parallel. Override with a constant when tuning by hand.
      averageValue: ""

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Spread replicas across nodes (preferred, not required — single-node clusters still work).
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: backend
  nodeSelector: {}
  tolerations: []

  service:
    type: ClusterIP
    port: 8000
    # MCP StreamableHTTP keeps session state in-process per pod. Round-robin
    # routing breaks sessions when follow-up requests land on a different pod,
    # surfacing as "McpError: Session terminated" in the client. ClientIP
    # affinity pins each client to one pod for the affinity window.
    sessionAffinity: ClientIP
    sessionAffinityTimeoutSeconds: 10800

  # Graceful shutdown — backend handles SIGTERM and drains the worker queue.
  terminationGracePeriodSeconds: 60

  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 2

# ─────────────────────────────────────────────────────────────────────────────
# Frontend (Next.js standalone)
# ─────────────────────────────────────────────────────────────────────────────
frontend:
  image:
    repository: skynet/frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  containerPort: 3001

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Optional mounts for internal CA bundles or site-specific runtime files.
  extraVolumes: []
  extraVolumeMounts: []

  env:
    NODE_ENV: production
    PORT: "3001"
    # API_URL is injected into browser pages and must be reachable from user
    # workstations. When empty, an explicit backend Route host is used; dev
    # values fall back to localhost.
    API_URL: ""
    # Server-only address used by NextAuth provisioning calls. Empty defaults
    # to the in-cluster backend Service.
    BACKEND_INTERNAL_URL: ""
    AUTH_URL: ""
    AUTH_SSO_ISSUER: ""
    AUTH_SSO_CLIENT_ID: ""
    AUTH_SSO_SCOPE: "openid profile email groups"
    AUTH_USERNAME_CLAIM: ""
    AUTH_GROUP_CLAIM: "groups"
    AUTH_ADMIN_GROUPS: ""
    # Break-glass admin users only. Prefer AUTH_ADMIN_GROUPS for normal admin assignment.
    AUTH_ADMINS: ""
    BACKEND_AUTH_TOKEN_TTL_SECONDS: "900"
    TRANSCRIPTION_ENABLED: "false"
    NODE_EXTRA_CA_CERTS: ""
    # Set to the deployed version so the UI footer reflects it. Defaults to a
    # stale 0.1.0 when unset.
    APP_VERSION: ""

  envFrom: []

  secrets:
    existingSecret: ""
    data:
      AUTH_SECRET: ""
      AUTH_SSO_CLIENT_SECRET: ""
      # Must match backend.secrets.data.BACKEND_AUTH_SECRET.
      BACKEND_AUTH_SECRET: ""

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: frontend
  nodeSelector: {}
  tolerations: []

  service:
    type: ClusterIP
    port: 3001

  terminationGracePeriodSeconds: 30

  probes:
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 2

# ─────────────────────────────────────────────────────────────────────────────
# External database (preferred for prod) — bring your own pgvector-enabled Postgres.
# ─────────────────────────────────────────────────────────────────────────────
externalDatabase:
  enabled: false
  host: ""
  port: 5432
  database: skynet
  user: skynet
  # Either supply password directly (renders into chart-managed Secret) ...
  password: ""
  # ... or reference an existing Secret with the password key.
  existingSecret: ""
  existingSecretKey: password
  # If true, the chart composes REMOTE_DB_URL from host/port/db/user/password.
  # If false, REMOTE_DB_URL must be set explicitly via backend.secrets.data.REMOTE_DB_URL.
  composeUrl: true
  sslmode: require

# ─────────────────────────────────────────────────────────────────────────────
# Bundled Postgres (StatefulSet) — convenient for self-contained installs / dev.
# Default ON when externalDatabase.enabled is false; set to false to skip.
# ─────────────────────────────────────────────────────────────────────────────
postgres:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    database: skynet
    username: skynet
    password: ""  # auto-generated random if left empty
    existingSecret: ""
  service:
    port: 5432
  maxConnections: 200
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1000m"
      memory: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  # Give postgres time to flush WAL and shut down cleanly on SIGTERM.
  terminationGracePeriodSeconds: 60
  # Postgres is a single replica by design (resource constraint). A PDB
  # with minAvailable=1 would block every node drain — usually worse than
  # the brief outage caused by an eviction. Enable this only if your
  # operations prefer "refuse the drain" over "tolerate a blip".
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# ─────────────────────────────────────────────────────────────────────────────
# Optional PgBouncer transaction-pooler. Enable in production overrides when
# backend replica × pool size would otherwise exceed Postgres connections.
# Enabling this requires backend env DB_PGBOUNCER_TRANSACTION_MODE=true; this
# chart sets that env var directly on backend pods when pgbouncer.enabled=true.
# ─────────────────────────────────────────────────────────────────────────────
pgbouncer:
  enabled: false
  replicas: 2
  image:
    repository: edoburu/pgbouncer
    tag: v1.24.1-p1
    pullPolicy: IfNotPresent
  service:
    port: 6432
  maxClientConn: 1000
  defaultPoolSize: 40
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ─────────────────────────────────────────────────────────────────────────────
# OpenShift Routes — preferred over Ingress on OCP.
# ─────────────────────────────────────────────────────────────────────────────
# TLS notes:
#   - termination: edge | reencrypt | passthrough
#   - When certificate/key are empty, the router serves its default wildcard
#     cert (typical for *.apps.<cluster>.example.com). Provide custom PEM via
#     `--set-file openshift.routes.backend.tls.certificate=./tls.crt`.
#   - reencrypt also needs destinationCACertificate (the CA that signs the
#     backend pod's cert) — required by OpenShift, the route controller will
#     reject the Route otherwise.
#   - passthrough ignores certificate/key/caCertificate (TLS terminates inside
#     the pod), so leave them empty.
openshift:
  routes:
    enabled: true
    backend:
      host: ""    # leave empty to let the router pick <name>-<ns>.<app-domain>
      annotations:
        # Long timeout for optimization runs that stream over a single TCP connection.
        haproxy.router.openshift.io/timeout: 5m
      tls:
        enabled: true
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
        certificate: ""
        key: ""
        caCertificate: ""
        destinationCACertificate: ""
    frontend:
      host: ""
      annotations: {}
      tls:
        enabled: true
        termination: edge
        insecureEdgeTerminationPolicy: Redirect
        certificate: ""
        key: ""
        caCertificate: ""
        destinationCACertificate: ""

# ─────────────────────────────────────────────────────────────────────────────
# NetworkPolicy
# ─────────────────────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true
  # Extra egress CIDRs applied to BOTH backend and frontend pods (e.g. SSO /
  # OIDC issuer, internal artifactory). All ports allowed within these CIDRs.
  egressCidrs: []
  # Backend-only LLM egress allowlist. Each entry pins a destination to a
  # specific port set, which is what a strict cluster policy actually wants
  # ("backend may reach api.openai.com on 443 only"). Use this when the
  # cluster default-denies egress; otherwise leave empty.
  #
  # If egressCidrs, llmEgress, embeddingEgress, ldapEgress, AND dbEgress are all
  # empty, the chart falls back to wide-open egress (0.0.0.0/0 except link-local).
  # The moment ANY of them is set, the chart treats it as the explicit
  # allowlist and removes the wide-open fallback — anything you forget here
  # will be denied.
  #
  # Example:
  #   llmEgress:
  #     - cidr: 104.18.0.0/16    # api.openai.com (Cloudflare)
  #       ports: [443]
  #     - cidr: 10.0.5.0/24      # internal LLM gateway
  #       ports: [443, 8443]
  llmEgress: []
  # Backend-only embedding API egress allowlist. Omit when the embedding API
  # lives behind the same CIDR as llmEgress; set it when recommendations use a
  # separate embedding gateway.
  #
  # Example:
  #   embeddingEgress:
  #     - cidr: 10.0.9.0/24      # internal embedding gateway
  #       ports: [443]
  embeddingEgress: []
  # Backend-only LDAP / Active Directory egress allowlist. Same shape as
  # llmEgress; default port is 636 (ldaps). Set this when the admin-tab
  # username autocomplete needs to reach a domain controller and the cluster
  # default-denies egress.
  #
  # Example:
  #   ldapEgress:
  #     - cidr: 10.0.6.0/24      # AD controller subnet
  #       ports: [636]           # 389 if you really must use ldap://
  ldapEgress: []
  # Backend + migration-Job egress to an EXTERNAL Postgres (postgres.enabled=false).
  # REQUIRED on default-deny clusters or the backend pool and the pre-install
  # migration Job can never reach the DB. Same shape as llmEgress; default port 5432.
  #
  # Example:
  #   dbEgress:
  #     - cidr: 10.0.4.0/24      # managed Postgres subnet
  #       ports: [5432]
  dbEgress: []

# ─────────────────────────────────────────────────────────────────────────────
# Migration job — runs the single fresh-install on-prem baseline. This chart
# intentionally does not adopt databases from hosted or older private builds.
# ─────────────────────────────────────────────────────────────────────────────
migration:
  enabled: true
  command: ["alembic", "upgrade", "head"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  backoffLimit: 1
  activeDeadlineSeconds: 600

# Extra labels/annotations applied to every resource in the chart.
commonLabels: {}
commonAnnotations: {}
