# Dependabot configuration.
#
# The backend deliberately uses the `uv` ecosystem, not `pip`. uv.lock is the
# source of truth for every install path that matters — CI (`uv sync --frozen`)
# and the default Docker build (PKG_MANAGER=uv) both install from it. The
# `pip` ecosystem would instead target the compiled requirements*.txt, which
# are exports of the lock; updating those alone leaves uv.lock stale, so the
# bump never reaches CI or the shipped image. That is exactly how starlette
# drifted to a version the pinned instrumentator could not accept.
#
# After a backend bump lands, regenerate the pip-path exports so both stay in
# sync (requirements.txt is guarded by the `requirements-sync` CI job):
#     uv export --no-emit-project --no-hashes -o requirements.txt
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
